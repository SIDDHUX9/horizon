services:
  # Official Midnight Zero-Knowledge Proof Server (local development only)
  horizon-proof-server:
    image: ghcr.io/midnight-ntwrk/proof-server:latest
    container_name: horizon-proof-server
    ports:
      - "6300:6300"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6300 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Production static build served by Vite preview.
  horizon-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: horizon-web-app
    ports:
      - "5173:4173"
    environment:
      - NODE_ENV=production
    depends_on:
      - horizon-proof-server
    restart: unless-stopped
