services:
  # Official Midnight Zero-Knowledge Proof Server
  horizon-proof-server:
    image: midnightnetwork/proof-server:latest
    container_name: horizon-proof-server
    ports:
      - "6300:6300"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6300 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Horizon Protocol Web Application & Transparency Explorer
  horizon-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: horizon-web-app
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_PROOF_SERVER_URL=http://localhost:6300
    depends_on:
      - horizon-proof-server
    restart: unless-stopped
