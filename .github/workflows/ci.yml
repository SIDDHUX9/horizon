name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Compact CLI
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/download/compact-v0.5.3/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.compact/bin" >> "$GITHUB_PATH"
      - name: Install pinned Compact compiler
        run: |
          compact update 0.36.1
          compact compile +0.36.1 --version
      - run: npm run typecheck
      - run: npm run verify:artifacts
      - run: npm run compile:compact -- --check
      - run: npm test
      - run: npm run build
      - run: npm run verify:build
      - run: npm run check:release
